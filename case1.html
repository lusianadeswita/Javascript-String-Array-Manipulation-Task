<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript CASE 1</title>
</head>
<body>
    <script>
        
const rawInput = " lusiana_deswita, CHARLES_KEITH , roni_zeki ";

// 1. Bersihkan whitespace awal dan akhir
const cleanedInput = rawInput.trim();

// 2. Ubah string menjadi array
const names = cleanedInput.split(",");

// 3. Bersihkan spasi dan ubah menjadi lowercase
const formattedNames = names.map(name =>
  name.trim().toLowerCase()
);

// 4. Gabungkan kembali menjadi string
const result = formattedNames.join(" | ");

console.log(result);

    </script>
</body>
</html>
